<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Interactive Toys</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 20px;
  }
  .container { max-width: 500px; width: 100%; }
  h1 { text-align: center; color: #FFF; font-size: 32px; margin-bottom: 8px; }
  .sub { text-align: center; color: rgba(255,255,255,0.7); margin-bottom: 30px; font-size: 14px; }
  .cards { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px); border-radius: 20px; padding: 24px;
    display: flex; align-items: center; gap: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    cursor: pointer; transition: all 0.3s; text-decoration: none;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 15px 50px rgba(0,0,0,0.2); }
  .card .icon { font-size: 48px; }
  .card .info h2 { font-size: 20px; color: #333; margin-bottom: 4px; }
  .card .info p { font-size: 13px; color: #999; line-height: 1.5; }
  .card .tag {
    display: inline-block; padding: 2px 10px; border-radius: 8px;
    font-size: 11px; font-weight: 600; margin-top: 6px;
  }
  .tag.new { background: #FF6B35; color: #FFF; }
  .footer { text-align: center; color: rgba(255,255,255,0.4); margin-top: 30px; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎮 小玩具们</h1>
  <p class="sub">点开就能玩，微信也能打开哦~</p>
  <div class="cards">
    <a class="card" href="crab-pet.html">
      <div class="icon">🦀</div>
      <div class="info">
        <h2>戳戳小螃蟹</h2>
        <p>戳它、喂它、摸头、哄睡，好感度越来越高~<br>眼睛会跟着鼠标转！</p>
        <span class="tag new">✨ 互动</span>
      </div>
    </a>
    <a class="card" href="muyu.html">
      <div class="icon">🥁</div>
      <div class="info">
        <h2>敲木鱼·攒功德</h2>
        <p>电子木鱼，连击加成，自动敲，成就系统<br>今日敲了多少次？</p>
        <span class="tag new">🔥 解压</span>
      </div>
    </a>
    <a class="card" href="fortune.html">
      <div class="icon">🎋</div>
      <div class="info">
        <h2>今日运势签</h2>
        <p>摇一摇抽签，大吉/中吉/小吉/末吉<br>还有隐藏款「极吉」🌟</p>
        <span class="tag new">🌟 运势</span>
      </div>
    </a>
  </div>
  <div class="footer">Made with ❤️ | Click to play</div>
</div>
</body>
</html>
